<!--
  Example custom icon.

  Staged into overrides/.icons/ by the build workflow and registered with
  pymdownx.emoji in shared/mkdocs.base.yml, so it is usable in any page as:

      :wt-docs:

  Add more SVGs alongside this one; the directory name becomes the prefix
  and the filename becomes the suffix (wt/docs.svg -> :wt-docs:).

  Icons must use `currentColor` for fill so they inherit the surrounding
  text colour and stay legible in both themes.
-->
