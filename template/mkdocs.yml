# Documentation configuration for {{REPO_NAME}}.
#
# Everything shared — theme, palette, markdown extensions, plugins,
# validation — is inherited from the template repository. This file carries
# only what makes this site *this* project.
#
# Never declare `plugins:` or `markdown_extensions:` here. MkDocs replaces
# lists rather than merging them, so doing so silently drops the entire
# shared configuration.
#
# PLACEHOLDERS to replace when stamping this into a repo:
#   {{SITE_NAME}}         Human-readable project name, e.g. "LEGO Block Creator"
#   {{SITE_DESCRIPTION}}  One sentence, reused as the meta description
#   {{OWNER}}             GitHub owner, e.g. "willtheorangeguy"
#   {{OWNER_LOWER}}       Owner lowercased, for the github.io hostname
#   {{REPO_NAME}}         Repository name, e.g. "LEGO-Block-Creator"
#   {{DEFAULT_BRANCH}}    "main" or "master"
#   {{DOCS_SUBPATH}}      "" normally; "docs/" when an app owns the Pages root

INHERIT: .mkdocs-shared/shared/mkdocs.base.yml

site_name: {{SITE_NAME}}
site_description: {{SITE_DESCRIPTION}}
site_author: {{OWNER}}

# Must be exact. Material derives canonical links, the sitemap, and instant
# navigation from it; a wrong value breaks search indexing silently.
site_url: https://{{OWNER_LOWER}}.github.io/{{REPO_NAME}}/{{DOCS_SUBPATH}}

repo_url: https://github.com/{{OWNER}}/{{REPO_NAME}}
repo_name: {{OWNER}}/{{REPO_NAME}}
edit_uri: edit/{{DEFAULT_BRANCH}}/docs/

copyright: Copyright &copy; {{OWNER}}

theme:
  # Delete this block if the repo has no artwork — the shared config falls
  # back to an icon. Keep it if docs/images/logo.png exists.
  logo: images/logo.png

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - API: api.md

  # Extended pages. Drop any entry the repo does not warrant:
  #   testing.md  — only when there is a test suite
  #   ci-cd.md    — only when there are workflows
  #   faq.md      — only when there are recurring questions
  - Development:
      - Testing: testing.md
      - CI/CD: ci-cd.md
      - FAQ: faq.md

  # Snippet pages. DELETE the entry AND the file for every root document
  # that does not exist in this repo — `check_paths: true` turns a missing
  # include into a build failure, not an empty page.
  - About:
      - Contributing: contributing.md
      - Changelog: changelog.md
      - Code of Conduct: code-of-conduct.md
      - Security: security.md
      - License: license.md

# The writing standard is shipped with the docs but is not a site page.
exclude_docs: |
  docs.instructions.md
